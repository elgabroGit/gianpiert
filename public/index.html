<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chango&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fissa con marchio e tre sezioni (Clienti, Task, Collaboratori); colonna centrale da 1120px; Clienti → cliente → progetto, con il progetto a due colonne (task | squadra e note) che diventa una colonna su telefono */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --ink:#111110; --muted:#696965; --line:#D8D8D3; --soft:#E7E7E3; --on-ink:#FAFAF8;
  --ok:#1D6A42; --ok-bg:#DDEEE3; --warn:#875800; --warn-bg:#F4E6C9; --bad:#A2231B; --bad-bg:#F5DCD9;
  --f-display:'Chango','Arial Black',Impact,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0D; --surface:#171716; --ink:#F0F0EC; --muted:#9B9B95; --line:#2D2D2B; --soft:#232321; --on-ink:#0E0E0D;
    --ok:#73C998; --ok-bg:#15281D; --warn:#E2B04F; --warn-bg:#2C2312; --bad:#F08B80; --bad-bg:#331A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0D; --surface:#171716; --ink:#F0F0EC; --muted:#9B9B95; --line:#2D2D2B; --soft:#232321; --on-ink:#0E0E0D;
  --ok:#73C998; --ok-bg:#15281D; --warn:#E2B04F; --warn-bg:#2C2312; --bad:#F08B80; --bad-bg:#331A18;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barra superiore */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.02em;line-height:1}

K7s4lIPE38cWRcYML0q5HSAOF1cAbOfv5pvLkA2C7hLx7gV+BdfiO1NSusXY9QuoBXsJXVcZ7PCTWHsXHOQjuJu1ZnKdLTDNE7Q65yahDXOK8wUTXPNPGE3dS4U7VYe39XwE8KkFEaHqDmIQewW5VIW4zhJG5TzA2MfRD+CbE8/BtcmP4ru+1+Opxr+QLf+epZtVyAIqhpMjbUnxsL53+KCU1SzcT3ZnaHL1/EsU6C+a/OU8E67qIpxsc2ii5tcyhJmPFow4ewOGnUD7PU+BxBWDtwzmww6gLRsUcxPHtXIAa6bqZP7o9b9DmJlhpcfiui0/ERtQ7EO9yxBFK5C582e5LM1Zj+4AG5J6VIo1hHljfFZRm3imnNGBaUprmWkV0K753L4vKaC/POtHrC/CzAl9JPr8TP322BjgN3xKXu7ZZ1MyQTow9Ji4xbW0GrpbNfmBEN2jT7b0dj0vuThCms4h7jdSF3eQsRY/NIeJ6DX6cJRK3NIzvN9JTfxE//1NPYYA2ZYzhGzY2GuLSiAwzjOVOyuBklnk+1d8a8Ax+9iBtrQcelIw07b1BijGe8snR5AnGiQwsSoSp4Isvy4zYj+BnD78uc1y2bAbkgaijLr+nl6fH87i4VohUc7KwyP8AFXbHMqKQd/8AAAAASUVORK5CYII=) center/contain no-repeat;flex:none}
.brand span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.tab .count{font-size:11px;font-weight:700;background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 7px}
.tab[aria-current="page"] .count{background:var(--on-ink);color:var(--ink)}

.wrap{max-width:1120px;margin:0 auto;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px;font-size:14px}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.banner p{margin:0;flex:1;min-width:220px}

/* Intestazioni */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1;margin:0;letter-spacing:.01em}
.head .sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Bottoni */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{opacity:.88}
.btn.small{padding:5px 11px;font-size:13px}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Chip filtri */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip .c{opacity:.6;margin-left:4px;font-weight:500}
.chips .sep{width:1px;height:20px;background:var(--line);margin:0 6px}

/* Pillole */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;line-height:1.3}
.pill.st-preventivo{border:1px dashed var(--muted);color:var(--muted)}
.pill.st-in-corso{background:var(--ink);color:var(--on-ink)}
.pill.st-consegnato{background:var(--soft);color:var(--ink)}
.pill.st-chiuso{color:var(--muted);background:transparent;border:1px solid var(--line)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ex{border:1px solid var(--line);color:var(--muted);font-weight:500}
.who{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.late{color:var(--bad);font-weight:600}

/* Righe (clienti e progetti) */
.plist{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1.4fr) minmax(0,1.2fr);gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none}
a.prow:hover{border-color:var(--ink)}
.prow.dashed{border-style:dashed;background:transparent}
.prow h3{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.005em;text-wrap:balance;overflow-wrap:anywhere}
.prow .client{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.prow .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:13px;color:var(--muted)}
.col{display:grid;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.col b{color:var(--ink)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.next{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.plain li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
@media (max-width:760px){.prow{grid-template-columns:1fr;gap:12px}}

/* Pagina cliente / progetto */
.back{display:inline-block;margin-bottom:14px;font-size:14px;color:var(--muted);text-decoration:none;font-weight:600}
.back:hover{color:var(--ink)}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--ink)}
.phead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:24px}
.phead .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.phead h1{font-size:clamp(26px,4.4vw,38px);line-height:1.08;margin:6px 0 10px;font-weight:700;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.phead .meta{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
.phead .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel h2 small{font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.notes{white-space:pre-wrap;color:var(--ink);font-size:14px;margin:0}
.stack{display:grid;gap:20px}
.section-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:26px 0 10px;display:flex;gap:8px;align-items:center}
.section-h:first-child{margin-top:0}
.section-h.bad{color:var(--bad)}
details.more{margin-top:22px}
details.more>summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 0;margin-bottom:10px}

/* Task */
.addtask{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;margin-bottom:14px}
@media (max-width:560px){.addtask{grid-template-columns:1fr 1fr}.addtask .t{grid-column:1/-1}}
.addtask input,.addtask select,.addcrew select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
.tlist{list-style:none;margin:0;padding:0;display:grid}
.tlist.panel{padding:4px 16px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .title{font-weight:500;overflow-wrap:anywhere}
.task .sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}
.task .sub a{color:var(--muted);text-decoration:none;font-weight:600}
.task .sub a:hover{color:var(--ink)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task .acts{display:flex;gap:2px;opacity:.55}
.task:hover .acts,.task:focus-within .acts{opacity:1}
.icon{border:0;background:transparent;cursor:pointer;border-radius:6px;padding:5px 7px;color:var(--muted);font-size:13px;font-weight:600}
.icon:hover{background:var(--soft);color:var(--ink)}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.check:hover{border-color:var(--ink)}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.check svg{width:14px;height:14px;stroke:var(--on-ink);opacity:0}
.check[aria-pressed="true"] svg{opacity:1}
details.done-block{margin-top:10px}
details.done-block summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;padding:6px 0}

/* Squadra di progetto */
.crew{list-style:none;margin:0 0 12px;padding:0;display:grid}
.crew li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.crew li:first-child{border-top:0}
.crew .r{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.addcrew{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}

/* Collaboratori */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px}
.resline{font-size:14px;color:var(--muted);margin:0 0 14px}
.resline b{color:var(--ink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.ccard h3{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.ccard .city{font-size:13px;color:var(--muted);margin-top:2px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink);background:transparent;cursor:pointer}
.tag:hover{border-color:var(--ink)}
.tag.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.contact{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;min-width:0}
.contact span{overflow-wrap:anywhere;min-width:0}
.ccard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;margin-top:auto}
.ccard a.lnk{font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ccard a.lnk:hover{text-decoration:underline}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;position:relative}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks span{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--muted)}
.checks input:checked+span{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.checks input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}

/* Stati vuoti */
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:46ch}
.empty p:last-child{margin-bottom:0}
.skel{height:76px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

<script>
(function(){
'use strict';

const OWNERS = ['Gianpiero','Mirko','Entrambi'];
const PSTATI = [
  {k:'preventivo', l:'Da confermare'},
  {k:'in-corso',   l:'In lavorazione'},
  {k:'consegnato', l:'Consegnato'},
  {k:'chiuso',     l:'Chiuso'}
];
const PORDER = {'in-corso':0,'preventivo':1,'consegnato':2,'chiuso':3};
const COLS = ['clients','projects','tasks','collaborators','fatture','costi'];
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GIORNI = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

const S = {
  db:null, dbState:'loading',
  clients:[], projects:[], tasks:[], collaborators:[], fatture:[], costi:[],
  loaded:{clients:false, projects:false, tasks:false, collaborators:false, fatture:false, costi:false},
  finYear:new Date().getFullYear(), ghostJump:null,
  readOnly:false, wroteOnce:false,
  route:{view:'clienti', id:null},
  f:{owner:'tutti', scope:'tutte', role:'', city:'', q:'', cq:''},
  cal:{y:new Date().getFullYear(), m:new Date().getMonth(), sel:[], who:'tutti', mode:(window.innerWidth < 720 ? 'lista' : 'mese')},
};
try{ const m = localStorage.getItem('lana-cal-mode'); if(m === 'mese' || m === 'lista') S.cal.mode = m; }catch(e){}

/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const plusDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
function fmtDate(s, withYear){
  if(!s) return '';
  const [y,m,d] = s.split('-');
  const sameYear = +y === new Date().getFullYear();
  return `${+d} ${MESI[+m-1]}` + ((withYear || !sameYear) ? ' ' + y : '');
}
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const norm = s => String(s || '').trim().toLowerCase();
const stLabel = k => (PSTATI.find(s => s.k === k) || PSTATI[1]).l;
const isLate = due => !!due && due < today();
const byDue = (a,b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.createdAt||0) - (b.createdAt||0);
const byStatus = (a,b) => (PORDER[a.status] ?? 9) - (PORDER[b.status] ?? 9) || (a.due || '9999').localeCompare(b.due || '9999') || (b.createdAt||0) - (a.createdAt||0);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';

/* ---------- relazioni ---------- */
const projOf = id => S.projects.find(p => p.id === id);
const clientOf = id => S.clients.find(c => c.id === id);
function clientOfProject(p){
  if(!p) return null;
  if(p.clientId){ const c = clientOf(p.clientId); if(c) return c; }
  return S.clients.find(c => norm(c.name) && norm(c.name) === norm(p.client)) || null;
}
const projectsOf = c => c.id === 'none'
  ? S.projects.filter(p => !clientOfProject(p) && !norm(p.client))
  : S.projects.filter(p => { const k = clientOfProject(p); return k && k.id === c.id; });
const tasksOfProjects = ps => { const ids = new Set(ps.map(p => p.id)); return S.tasks.filter(t => t.projectId && ids.has(t.projectId)); };
const ownerMatch = t => S.f.owner === 'tutti' || t.owner === S.f.owner || t.owner === 'Entrambi';
function orphanNames(){
  const m = new Map();
  S.projects.forEach(p => {
    if(clientOfProject(p)) return;
    const n = String(p.client || '').trim();
    if(n && !m.has(norm(n))) m.set(norm(n), n);
  });
  return [...m.values()].sort((a,b) => a.localeCompare(b));
}
async function ensureClient(db, name){
  name = String(name || '').trim(); if(!name) return '';
  const ex = S.clients.find(c => norm(c.name) === norm(name)); if(ex) return ex.id;
  const id = uid('k');
  await db.doc('clients/' + id).set({name, referente:'', email:'', phone:'', notes:'', createdAt:Date.now()});
  return id;
}
const clientHash = p => { const c = clientOfProject(p); return c ? 'cliente-' + c.id : 'cliente-none'; };

/* ---------- avvisi ---------- */
let toastTimer = 0;
function toast(msg, actionLabel, action){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : '');
  el.hidden = false;
  if(actionLabel){ el.querySelector('button').onclick = () => { el.hidden = true; action(); }; }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, actionLabel ? 6000 : 3200);
}
function errMsg(e){
  const c = e && e.code;
  if(c === 'quota_exceeded') return 'Archivio pieno: elimina qualche elemento vecchio e riprova.';
  if(c === 'invalid_argument') return 'Non hai i permessi per modificare: serve l’accesso in modifica a questa pagina.';
  if(c === 'revoked') return 'L’accesso a questa pagina è cambiato. Ricarica la pagina.';
  return 'Salvataggio non riuscito: controlla la connessione e riprova.';
}
async function write(fn, okMsg){
  if(!S.db){ toast('Apri la pagina da claude.ai per salvare.'); return false; }
  if(S.readOnly){ toast('Questa pagina è in sola lettura per te.'); return false; }
  try{
    await fn(S.db);
    S.wroteOnce = true;
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){
    if(e && e.code === 'unavailable'){
      try{ await new Promise(r => setTimeout(r, 400 + Math.random()*600)); await fn(S.db); S.wroteOnce = true; if(okMsg) toast(okMsg); return true; }catch(e2){ e = e2; }
    }
    if(e && e.code === 'invalid_argument' && !S.wroteOnce){ S.readOnly = true; render(); }
    toast(errMsg(e));
    return false;
  }
}

/* ---------- percorsi ---------- */
function readRoute(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('fatture-progetto-')) return {view:'fatture-progetto', id:h.slice(17)};
  if(h.startsWith('fatture-cliente-')) return {view:'fatture-cliente', id:h.slice(16)};
  if(h === 'fatture') return {view:'fatture', id:null};
  if(h.startsWith('progetto-')) return {view:'progetto', id:h.slice(9)};
  if(h.startsWith('cliente-')) return {view:'cliente', id:h.slice(8)};
  if(h === 'task' || h === 'collaboratori' || h === 'calendario') return {view:h, id:null};
  return {view:'clienti', id:null};
}
function go(h){
  if(location.hash === '#' + h){ S.route = readRoute(); render(); }
  else location.hash = h;
}
window.addEventListener('hashchange', () => { S.route = readRoute(); render(); window.scrollTo(0,0); });

/* ---------- disegno ---------- */
let raf = 0;
function render(){
  if(S.dragging){ S.pendingRender = true; return; }
  if(raf) return; raf = requestAnimationFrame(() => { raf = 0; draw(); });
}

function draw(){
  const app = $('#app');
  const keep = {};
  const act = document.activeElement;
  app.querySelectorAll('input[id],select[id],textarea[id]').forEach(el => {
    const k = el.dataset.keep;
    if(k === 'no' || (k === 'focus' && el !== act)) return;
    keep[el.id] = el.value;
  });
  const focusId = act && app.contains(act) && act.id ? act.id : null;
  let sel = null;
  try{ if(focusId && typeof act.selectionStart === 'number') sel = [act.selectionStart, act.selectionEnd]; }catch(e){}
  const openDetails = [...app.querySelectorAll('details[id]')].filter(d => d.open).map(d => d.id);

  app.innerHTML = view();

  for(const id in keep){ const el = document.getElementById(id); if(el && el.dataset.keep !== 'no') el.value = keep[id]; }
  openDetails.forEach(id => { const d = document.getElementById(id); if(d) d.open = true; });
  if(focusId){ const el = document.getElementById(focusId); if(el){ el.focus({preventScroll:true}); if(sel) try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
  if(S.ghostJump){
    const g = S.ghostJump;
    if(Date.now() > g.until) S.ghostJump = null;
    else if(document.querySelector(`tr[data-rowid="${g.id}"]`)){
      const a = document.activeElement;
      if(!g.stay && a && a.dataset && a.dataset.newrow === g.pid && a.dataset.col === g.col){
        const t = document.getElementById(`g-${g.col}-${g.id}-${a.dataset.k}`);
        if(t) t.focus({preventScroll:true});
      }
      S.ghostJump = null;
    }
  }

  const cur = S.route.view === 'progetto' || S.route.view === 'cliente' ? 'clienti' : S.route.view.startsWith('fatture') ? 'fatture' : S.route.view;
  document.querySelectorAll('[data-tab]').forEach(t => { if(t.dataset.tab === cur) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
  const open = S.tasks.filter(t => !t.done).length;
  const tc = $('#taskCount'); tc.hidden = !open; tc.textContent = open;
  $('#banner').innerHTML = banner();
}

function banner(){
  if(S.dbState === 'off') return `<div class="banner warn"><p>L'archivio condiviso si apre solo da claude.ai con l'accesso effettuato. Da qui non è possibile leggere o salvare dati.</p></div>`;
  if(S.dbState === 'error') return `<div class="banner warn"><p>Collegamento all'archivio interrotto. Ricarica la pagina per riprendere.</p></div>`;
  if(S.readOnly) return `<div class="banner warn"><p>Puoi consultare il gestionale ma non modificarlo. Chiedi a chi l'ha creato di darti l'accesso in modifica.</p></div>`;
  const ex = [...S.projects, ...S.tasks, ...S.clients].filter(x => x.esempio).length;
  if(ex) return `<div class="banner"><p>Dentro ci sono alcuni dati di esempio (segnati con «Esempio»). Quando non ti servono più, eliminali in un clic.</p><button class="btn small" data-a="arm-del" data-del="examples:all">Elimina i dati di esempio</button></div>`;
  return '';
}

const ready = () => COLS.every(c => S.loaded[c]);
const TITLES = {task:'Task', collaboratori:'Collaboratori', calendario:'Calendario', fatture:'Fatture', 'fatture-cliente':'Fatture', 'fatture-progetto':'Fatture'};

function view(){
  if(S.dbState === 'loading' || (S.db && !ready())){
    return `<div class="head"><div><h1>${TITLES[S.route.view] || 'Clienti'}</h1><p class="sub">Caricamento dell'archivio condiviso…</p></div></div><div class="plist"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  }
  switch(S.route.view){
    case 'cliente': return viewClient(S.route.id);
    case 'progetto': return viewProject(S.route.id);
    case 'task': return viewTasks();
    case 'collaboratori': return viewCollabs();
    case 'calendario': return viewCalendar();
    case 'fatture': return viewFin();
    case 'fatture-cliente': return viewFinClient(S.route.id);
    case 'fatture-progetto': return viewFinProject(S.route.id);
    default: return viewClients();
  }
}

/* ---------- Clienti ---------- */
function viewClients(){
  const q = norm(S.f.cq);
  const rows = S.clients
    .filter(c => !q || norm([c.name, c.referente, c.email, c.notes].join(' ')).includes(q))
    .map(c => {
      const ps = projectsOf(c), active = ps.filter(p => p.status !== 'chiuso');
      const open = tasksOfProjects(ps).filter(t => !t.done);
      return {c, ps, active, open, late: open.filter(t => isLate(t.due)).length};
    })
    .sort((a,b) => (b.active.length > 0) - (a.active.length > 0) || a.c.name.localeCompare(b.c.name));
  const orphans = q ? [] : orphanNames();
  const none = projectsOf({id:'none'});
  const withActive = rows.filter(r => r.active.length).length;

  let out = `<div class="head"><div><h1>Clienti</h1><p class="sub">${plural(S.clients.length, 'cliente', 'clienti')} · ${withActive} con progetti in corso</p></div>
    <div class="actions"><button class="btn primary" data-a="new-client">+ Nuovo cliente</button></div></div>`;

  if(!S.clients.length && !orphans.length && !none.length){
    return out + `<div class="empty"><strong>Ancora nessun cliente</strong><p>Crea la scheda del cliente con referente e contatti, poi entra e aggiungi i suoi progetti.</p><button class="btn primary" data-a="new-client">+ Nuovo cliente</button></div>`;
  }
  out += `<div class="toolbar"><input class="search" id="client-q" type="search" placeholder="Cerca un cliente o un referente" value="${esc(S.f.cq)}" aria-label="Cerca tra i clienti" autocomplete="off"></div>`;
  if(q && !rows.length) return out + `<div class="empty"><strong>Nessun cliente trovato</strong><p>Controlla il nome o crea una nuova scheda.</p></div>`;

  const html = rows.map(({c, ps, active, open, late}) => `<a class="prow" href="#cliente-${esc(c.id)}">
    <div style="min-width:0">
      <h3>${esc(c.name)}</h3>
      <div class="client">${esc([c.referente, c.email || c.phone].filter(Boolean).join(' · ') || 'Nessun referente indicato')}</div>
      <div class="meta">${active.length ? `<span class="pill st-in-corso">${plural(active.length, 'progetto attivo', 'progetti attivi')}</span>` : `<span class="pill st-chiuso">Nessun progetto attivo</span>`}${c.esempio ? '<span class="pill ex">Esempio</span>' : ''}</div>
    </div>
    <div class="col">
      ${active.length ? `<ul class="plain">${active.sort(byStatus).slice(0,3).map(p => `<li>${esc(p.name)}</li>`).join('')}${active.length > 3 ? `<li style="color:var(--muted)">e altri ${active.length - 3}</li>` : ''}</ul>` : `<span>${ps.length ? plural(ps.length, 'progetto chiuso', 'progetti chiusi') : 'Entra per aggiungere il primo progetto'}</span>`}
    </div>
    <div class="col num">
      <span><b>${plural(open.length, 'task aperta', 'task aperte')}</b></span>
      ${late ? `<span class="late">${plural(late, 'in ritardo', 'in ritardo')}</span>` : `<span>${open.length ? 'nessuna in ritardo' : 'niente da fare'}</span>`}
    </div>
  </a>`).join('');

  const orphanHtml = orphans.map(n => `<div class="prow dashed">
    <div style="min-width:0"><h3>${esc(n)}</h3><div class="client">Nome scritto in un progetto, senza scheda cliente</div></div>
    <div class="col"><span>${plural(S.projects.filter(p => !clientOfProject(p) && norm(p.client) === norm(n)).length, 'progetto', 'progetti')}</span></div>
    <div class="col"><button class="btn small primary" data-a="make-client" data-name="${esc(n)}" style="justify-self:start">Crea scheda cliente</button></div>
  </div>`).join('');

  const noneHtml = (!q && none.length) ? (() => {
    const open = tasksOfProjects(none).filter(t => !t.done);
    return `<a class="prow dashed" href="#cliente-none">
      <div style="min-width:0"><h3>Senza cliente</h3><div class="client">Progetti interni di Lana Studio</div></div>
      <div class="col"><ul class="plain">${none.sort(byStatus).slice(0,3).map(p => `<li>${esc(p.name)}</li>`).join('')}</ul></div>
      <div class="col num"><span><b>${plural(open.length, 'task aperta', 'task aperte')}</b></span></div>
    </a>`;
  })() : '';

  return out + `<div class="plist">${html}${orphanHtml}${noneHtml}</div>`;
}

function viewClient(id){
  const none = id === 'none';
  const c = none ? {id:'none', name:'Senza cliente'} : clientOf(id);
  if(!c) return `<a class="back" href="#clienti">← Tutti i clienti</a><div class="empty"><strong>Cliente non trovato</strong><p>Potrebbe essere stato eliminato.</p></div>`;
  const ps = projectsOf(c).sort(byStatus);
  const active = ps.filter(p => p.status !== 'chiuso'), closed = ps.filter(p => p.status === 'chiuso');
  const open = tasksOfProjects(ps).filter(t => !t.done);
  const copyBit = v => `<span><span class="num">${esc(v)}</span> <button class="icon" data-a="copy" data-v="${esc(v)}" aria-label="Copia ${esc(v)}">Copia</button></span>`;
  const newBtn = `<button class="btn primary" data-a="new-project" data-client="${none ? '' : esc(c.name)}">+ Nuovo progetto</button>`;

  let out = `<a class="back" href="#clienti">← Tutti i clienti</a>
  <section class="phead">
    <div style="min-width:0;flex:1">
      <div class="eyebrow">${none ? 'Lana Studio' : 'Cliente'}</div>
      <h1>${esc(c.name)}</h1>
      <div class="meta">
        ${none ? '<span>Progetti senza un cliente: attività interne, prove, idee.</span>' : `
          ${c.referente ? `<span>Referente <b style="color:var(--ink)">${esc(c.referente)}</b></span>` : ''}
          ${c.email ? copyBit(c.email) : ''}
          ${c.phone ? copyBit(c.phone) : ''}
          ${!c.referente && !c.email && !c.phone ? '<span>Aggiungi referente e contatti da «Modifica»</span>' : ''}`}
      </div>
    </div>
    <div class="tools">${none ? '' : `<button class="btn" data-a="edit-client" data-id="${esc(c.id)}">Modifica</button>`}${newBtn}</div>
  </section>`;

  out += `<div class="section-h">Progetti attivi <span class="num">${active.length}</span>${open.length ? ` · <span class="num" style="letter-spacing:0;text-transform:none;font-weight:600">${plural(open.length, 'task aperta', 'task aperte')}</span>` : ''}</div>`;
  out += active.length ? `<div class="plist">${active.map(projectRow).join('')}</div>`
    : `<div class="empty"><strong>Nessun progetto attivo</strong><p>Crea un progetto: dentro aggiungi le task, la squadra e le note.</p>${newBtn}</div>`;
  if(closed.length) out += `<details class="more" id="closed-${esc(c.id)}"><summary>Progetti chiusi (${closed.length})</summary><div class="plist">${closed.map(projectRow).join('')}</div></details>`;
  if(!none && c.notes) out += `<section class="panel" style="margin-top:24px"><h2>Note sul cliente</h2><p class="notes">${esc(c.notes)}</p></section>`;
  return out;
}

function projectRow(p){
  const ts = S.tasks.filter(t => t.projectId === p.id);
  const done = ts.filter(t => t.done).length;
  const next = ts.filter(t => !t.done).sort(byDue)[0];
  const pct = ts.length ? Math.round(done / ts.length * 100) : 0;
  const lateDue = isLate(p.due) && (p.status === 'in-corso' || p.status === 'preventivo');
  return `<a class="prow" href="#progetto-${esc(p.id)}">
    <div style="min-width:0">
      <h3>${esc(p.name || 'Senza nome')}</h3>
      <div class="meta" style="margin-top:6px"><span class="pill st-${esc(p.status || 'in-corso')}">${stLabel(p.status)}</span>${p.due ? `<span class="${lateDue ? 'late' : ''}">Consegna ${fmtDate(p.due)}</span>` : ''}${p.esempio ? '<span class="pill ex">Esempio</span>' : ''}</div>
    </div>
    <div class="col">
      <span class="num">${ts.length ? `${done} di ${ts.length} task fatte` : 'Nessuna task'}</span>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    </div>
    <div class="col">
      ${next ? `<span>Prossima</span><span class="next">${esc(next.title)}${next.due ? ` · <span class="${isLate(next.due) ? 'late' : ''}">${fmtDate(next.due)}</span>` : ''}</span>` : `<span>${ts.length ? 'Tutto fatto' : 'Aggiungi la prima task'}</span>`}
    </div>
  </a>`;
}

/* ---------- Progetto ---------- */
function viewProject(id){
  const p = projOf(id);
  if(!p) return `<a class="back" href="#clienti">← Tutti i clienti</a><div class="empty"><strong>Progetto non trovato</strong><p>Potrebbe essere stato eliminato.</p></div>`;
  const c = clientOfProject(p);
  const ts = S.tasks.filter(t => t.projectId === id);
  const open = ts.filter(t => !t.done).sort(byDue);
  const done = ts.filter(t => t.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
  const crewIds = Array.isArray(p.crew) ? p.crew : [];
  const crew = crewIds.map(cid => S.collaborators.find(x => x.id === cid)).filter(Boolean);
  const available = S.collaborators.filter(x => !crewIds.includes(x.id)).sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const cName = c ? c.name : (p.client || 'Senza cliente');

  return `<nav class="crumbs" aria-label="Percorso"><a href="#clienti">Clienti</a><span>/</span><a href="#${clientHash(p)}">${esc(cName)}</a></nav>
  <section class="phead">
    <div style="min-width:0;flex:1">
      <div class="eyebrow">${esc(cName)}</div>
      <h1>${esc(p.name || 'Senza nome')}</h1>
      <div class="meta">${p.due ? `<span class="${isLate(p.due) && p.status !== 'chiuso' && p.status !== 'consegnato' ? 'late' : ''}">Consegna ${fmtDate(p.due, true)}</span>` : '<span>Nessuna data di consegna</span>'}${p.esempio ? '<span class="pill ex">Esempio</span>' : ''}</div>
    </div>
    <div class="tools">
      <label class="vh" for="pstatus-${esc(id)}">Stato del progetto</label>
      <select class="inline" id="pstatus-${esc(id)}" data-keep="no" data-c="p-status" data-id="${esc(id)}">${PSTATI.map(s => `<option value="${s.k}" ${p.status === s.k ? 'selected' : ''}>${s.l}</option>`).join('')}</select>
      <button class="btn" data-a="edit-project" data-id="${esc(id)}">Modifica</button>
    </div>
  </section>
  <div class="cols">
    <section class="panel">
      <h2>Task <small class="num">${open.length} da fare${done.length ? ` · ${done.length} fatte` : ''}</small></h2>
      <form class="addtask wide" data-form="add-task" data-id="${esc(id)}">
        <input class="t" id="nt-title-${esc(id)}" name="title" placeholder="Nuova task, es. «Mandare il treatment al cliente»" autocomplete="off" aria-label="Titolo della task">
        <select id="nt-owner-${esc(id)}" name="owner" aria-label="Chi se ne occupa">${OWNERS.map(o => `<option>${o}</option>`).join('')}</select>
        <select id="nt-collab-${esc(id)}" name="collab" aria-label="Collaboratore che la svolge">${collabOptions('', crewIds)}</select>
        <input type="date" id="nt-due-${esc(id)}" name="due" aria-label="Scadenza">
        <button class="btn primary" type="submit">Aggiungi</button>
      </form>
      ${open.length ? `<ul class="tlist">${open.map(t => taskItem(t, false)).join('')}</ul>` : `<p style="color:var(--muted);margin:6px 2px">${ts.length ? 'Tutte le task sono fatte.' : 'Nessuna task. Scrivi la prima qui sopra e premi Invio.'}</p>`}
      ${done.length ? `<details class="done-block" id="done-${esc(id)}"><summary>Fatte (${done.length})</summary><ul class="tlist">${done.map(t => taskItem(t, false)).join('')}</ul></details>` : ''}
    </section>
    <div class="stack">
      <section class="panel">
        <h2>Squadra <small class="num">${crew.length ? plural(crew.length, 'persona', 'persone') : ''}</small></h2>
        ${crew.length ? `<ul class="crew">${crew.map(x => `<li><div style="min-width:0"><b>${esc(x.name)}</b><div class="r">${esc((x.roles||[]).slice(0,3).join(', '))}${x.phone ? ' · ' + esc(x.phone) : ''}</div></div><button class="icon" data-a="crew-rm" data-p="${esc(id)}" data-id="${esc(x.id)}" aria-label="Togli ${esc(x.name)} dalla squadra">Togli</button></li>`).join('')}</ul>` : `<p style="color:var(--muted);font-size:14px;margin:0 0 12px">Nessuno in squadra. Aggiungi le persone del collettivo che lavorano a questo progetto.</p>`}
        ${S.collaborators.length ? `<form class="addcrew" data-form="crew-add" data-id="${esc(id)}">
          <select id="crew-sel-${esc(id)}" name="cid" aria-label="Collaboratore da aggiungere"><option value="">Scegli un collaboratore…</option>${available.map(x => `<option value="${esc(x.id)}">${esc(x.name)}${(x.roles||[]).length ? ' — ' + esc(x.roles.slice(0,2).join(', ')) : ''}</option>`).join('')}</select>
          <button class="btn small" type="submit">Aggiungi</button>
        </form>
        <p style="margin:10px 0 0;font-size:13px"><a href="#collaboratori" style="color:var(--muted);font-weight:600">Cerca per mansione tra i collaboratori →</a></p>` : `<a class="btn small" href="#collaboratori">Vai ai collaboratori</a>`}
      </section>
      <section class="panel">
        <h2>Note <button class="btn small" data-a="edit-project" data-id="${esc(id)}">${p.notes ? 'Modifica' : 'Aggiungi'}</button></h2>
        ${p.notes ? `<p class="notes">${esc(p.notes)}</p>` : `<p style="color:var(--muted);font-size:14px;margin:0">Link al materiale, accordi presi, referenti sul set…</p>`}
      </section>
    </div>
  </div>`;
}

function taskItem(t, showWhere){
  let where = '';
  if(showWhere){
    if(!t.projectId) where = '<span class="pill ex">To do Lana</span>';
    else {
      const p = projOf(t.projectId), c = clientOfProject(p);
      where = p ? `<a href="#progetto-${esc(p.id)}">${c ? esc(c.name) + ' · ' : ''}${esc(p.name)}</a>` : '<span>Progetto eliminato</span>';
    }
  }
  return `<li class="task ${t.done ? 'done' : ''}">
    <button class="check" aria-pressed="${!!t.done}" aria-label="${t.done ? 'Segna da fare' : 'Segna come fatta'}: ${esc(t.title)}" data-a="toggle-task" data-id="${esc(t.id)}">${CHECK}</button>
    <div style="min-width:0">
      <div class="title">${esc(t.title)}</div>
      <div class="sub">
        ${t.owner ? `<span class="who">${esc(t.owner)}</span>` : ''}
        ${collabOf(t.collabId) ? `<span>con <b style="color:var(--ink);font-weight:600">${esc(collabOf(t.collabId).name)}</b></span>` : ''}
        ${t.due ? `<span class="${!t.done && isLate(t.due) ? 'late' : ''}">${!t.done && isLate(t.due) ? 'Scaduta il ' : 'Entro il '}${fmtDate(t.due)}</span>` : ''}
        ${where}
        ${t.esempio ? '<span class="pill ex">Esempio</span>' : ''}
      </div>
    </div>
    <div class="acts">
      <button class="icon" data-a="edit-task" data-id="${esc(t.id)}" aria-label="Modifica task">Modifica</button>
      <button class="icon" data-a="del-task" data-id="${esc(t.id)}" aria-label="Elimina task">Elimina</button>
    </div>
  </li>`;
}

/* ---------- Task ---------- */
function viewTasks(){
  const sc = S.f.scope;
  const all = S.tasks.filter(ownerMatch).filter(t => sc === 'tutte' || (sc === 'lana' ? !t.projectId : !!t.projectId));
  const open = all.filter(t => !t.done).sort(byDue);
  const late = open.filter(t => isLate(t.due));
  const week = open.filter(t => t.due && !isLate(t.due) && t.due <= plusDays(7));
  const later = open.filter(t => t.due && t.due > plusDays(7));
  const nodate = open.filter(t => !t.due);
  const done = all.filter(t => t.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
  const nLana = S.tasks.filter(t => !t.projectId && !t.done).length;
  const chipO = (k,l) => `<button class="chip" aria-pressed="${S.f.owner === k}" data-a="f-owner" data-v="${k}">${l}</button>`;
  const chipS = (k,l) => `<button class="chip" aria-pressed="${sc === k}" data-a="f-scope" data-v="${k}">${l}</button>`;

  let out = `<div class="head"><div><h1>Task</h1><p class="sub">${open.length} aperte${late.length ? ` · <span class="late">${late.length} in ritardo</span>` : ''}${sc === 'lana' ? ' nel To do di Lana' : sc === 'progetti' ? ' nei progetti' : ', tra To do di Lana e progetti'}</p></div></div>
  <section class="panel" style="margin-bottom:18px">
    <h2>To do di Lana <small class="num">${nLana} da fare · cose che non riguardano un progetto</small></h2>
    <form class="addtask" data-form="add-todo" style="margin-bottom:0">
      <input class="t" id="todo-title" name="title" placeholder="Es. Chiamare Edoardo per il service di dicembre" autocomplete="off" aria-label="Cosa c'è da fare">
      <select id="todo-owner" name="owner" aria-label="Chi se ne occupa">${OWNERS.map(o => `<option>${o}</option>`).join('')}</select>
      <input type="date" id="todo-due" name="due" aria-label="Scadenza">
      <button class="btn primary" type="submit">Aggiungi</button>
    </form>
  </section>
  <div class="chips" role="group" aria-label="Filtra le task">${chipS('tutte','Tutte')}${chipS('lana','Solo To do di Lana')}${chipS('progetti','Solo progetti')}<span class="sep"></span>${chipO('tutti','Tutti')}${chipO('Gianpiero','Gianpiero')}${chipO('Mirko','Mirko')}</div>`;

  if(!S.tasks.length) return out + `<div class="empty"><strong>Nessuna task</strong><p>Scrivi qui sopra le cose da fare per Lana, oppure entra in un cliente, apri un progetto e aggiungi le sue task.</p></div>`;

  const group = (title, arr, cls) => arr.length ? `<div class="section-h ${cls || ''}">${title} <span class="num">${arr.length}</span></div><ul class="tlist panel">${arr.map(t => taskItem(t, true)).join('')}</ul>` : '';
  let body = group('In ritardo', late, 'bad') + group('Prossimi 7 giorni', week) + group('Più avanti', later) + group('Senza scadenza', nodate);
  if(!open.length) body = `<div class="empty"><strong>Niente da fare${S.f.owner !== 'tutti' ? ' per ' + esc(S.f.owner) : ''}</strong><p>Tutte le task aperte sono state completate.</p></div>`;
  if(done.length) body += `<details class="done-block" id="done-all" style="margin-top:20px"><summary>Fatte (${done.length})</summary><ul class="tlist panel">${done.slice(0,60).map(t => taskItem(t, true)).join('')}</ul></details>`;
  return out + body;
}

/* ---------- Calendario ---------- */
const collabOf = id => id ? S.collaborators.find(c => c.id === id) : null;
function whoLine(t){
  const co = collabOf(t.collabId);
  return [t.owner, co ? 'con ' + co.name : ''].filter(Boolean).join(' · ');
}
function calItems(){
  const C = S.cal, items = [];
  S.projects.forEach(p => {
    if(!p.due || p.status === 'chiuso') return;
    const c = clientOfProject(p);
    items.push({kind:'del', date:p.due, p, ck: c ? c.id : 'none', cname: c ? c.name : 'Senza cliente'});
  });
  S.tasks.forEach(t => {
    if(!t.due) return;
    if(C.who !== 'tutti' && !(t.owner === C.who || t.owner === 'Entrambi')) return;
    let ck = 'lana', cname = 'To do di Lana', p = null;
    if(t.projectId){ p = projOf(t.projectId); const c = clientOfProject(p); ck = c ? c.id : 'none'; cname = c ? c.name : 'Senza cliente'; }
    items.push({kind:'task', date:t.due, t, p, ck, cname});
  });
  const sel = C.sel;
  return (sel.length ? items.filter(i => sel.includes(i.ck)) : items)
    .sort((a,b) => a.date.localeCompare(b.date) || (a.kind === 'del' ? -1 : 1) - (b.kind === 'del' ? -1 : 1) || (a.t && b.t ? (a.t.done - b.t.done) : 0));
}
function evHtml(i){
  if(i.kind === 'del'){
    return `<a class="ev del" href="#progetto-${esc(i.p.id)}" draggable="false" data-drag="${esc(i.p.id)}" data-kind="del" data-date="${esc(i.date)}" title="Consegna: ${esc(i.cname)} · ${esc(i.p.name)}"><span class="et">Consegna · ${esc(i.p.name)}</span><span class="em">${esc(i.cname)}</span></a>`;
  }
  const t = i.t, late = !t.done && isLate(t.due);
  const where = i.p ? `${i.cname} · ${i.p.name}` : i.cname;
  const who = whoLine(t);
  return `<button class="ev ${t.done ? 'done' : ''} ${late ? 'late' : ''}" data-a="edit-task" data-id="${esc(t.id)}" draggable="false" data-drag="${esc(t.id)}" data-kind="task" data-date="${esc(i.date)}" title="${esc(t.title)} — ${esc(where)}${who ? ' — ' + esc(who) : ''}"><span class="et">${esc(t.title)}</span><span class="em">${esc(who || 'Nessuno assegnato')} · ${esc(where)}</span></button>`;
}
function viewCalendar(){
  const C = S.cal;
  const items = calItems();
  const first = new Date(C.y, C.m, 1), last = new Date(C.y, C.m + 1, 0);
  const mStart = ymd(first), mEnd = ymd(last);
  const inMonth = items.filter(i => i.date >= mStart && i.date <= mEnd);
  const nDel = inMonth.filter(i => i.kind === 'del').length, nTask = inMonth.filter(i => i.kind === 'task' && !i.t.done).length;
  const overdue = items.filter(i => i.kind === 'task' && !i.t.done && isLate(i.date)).length;
  const hasNone = S.projects.some(p => !clientOfProject(p));
  const chipW = (k,l) => `<button class="chip" aria-pressed="${C.who === k}" data-a="cal-who" data-v="${k}">${l}</button>`;
  const chipC = (k,l) => `<button class="chip" aria-pressed="${C.sel.includes(k)}" data-a="cal-client" data-v="${esc(k)}">${esc(l)}</button>`;
  const clientsSorted = [...S.clients].sort((a,b) => a.name.localeCompare(b.name));

  let out = `<div class="head"><div><h1>Calendario</h1><p class="sub">${plural(nDel, 'consegna', 'consegne')} e ${plural(nTask, 'task da fare', 'task da fare')} a ${MESI_L[C.m].toLowerCase()}${overdue ? ` · <span class="late">${plural(overdue, 'task scaduta', 'task scadute')}</span>` : ''}</p></div></div>
  <div class="chips" role="group" aria-label="Filtra per persona">${chipW('tutti','Tutti')}${chipW('Gianpiero','Gianpiero')}${chipW('Mirko','Mirko')}</div>
  <div class="chips" role="group" aria-label="Filtra per cliente">
    <button class="chip" aria-pressed="${!C.sel.length}" data-a="cal-allclients">Tutti i clienti</button>
    ${clientsSorted.map(c => chipC(c.id, c.name)).join('')}
    ${hasNone ? chipC('none', 'Senza cliente') : ''}
    ${chipC('lana', 'To do di Lana')}
  </div>
  <div class="calbar">
    <button class="btn small" data-a="cal-prev" aria-label="Mese precedente">←</button>
    <h2 class="month">${MESI_L[C.m]} ${C.y}</h2>
    <button class="btn small" data-a="cal-next" aria-label="Mese successivo">→</button>
    <button class="btn small" data-a="cal-today">Oggi</button>
    <span class="grow"></span>
    <div class="seg2" role="group" aria-label="Vista"><button data-a="cal-mode" data-v="mese" aria-pressed="${C.mode === 'mese'}">Mese</button><button data-a="cal-mode" data-v="lista" aria-pressed="${C.mode === 'lista'}">Elenco</button></div>
  </div>
  <p class="legend"><span><i class="l-del"></i>Consegna del progetto</span><span><i></i>Task</span><span><i class="l-late"></i>Task scaduta</span>${C.mode === 'mese' ? '<span>· Trascina un evento su un altro giorno per spostarlo</span>' : ''}</p>`;

  const byDate = new Map();
  items.forEach(i => { if(!byDate.has(i.date)) byDate.set(i.date, []); byDate.get(i.date).push(i); });
  const td = today();

  if(C.mode === 'lista'){
    const days = [...byDate.keys()].filter(d => d >= mStart && d <= mEnd).sort();
    if(!days.length) return out + `<div class="empty"><strong>Nessuna scadenza a ${MESI_L[C.m].toLowerCase()}</strong><p>Le date arrivano dalle consegne dei progetti e dalle scadenze delle task. Cambia mese o filtro, oppure aggiungi una task.</p><button class="btn primary" data-a="cal-day" data-d="${C.y === new Date().getFullYear() && C.m === new Date().getMonth() ? td : mStart}">+ Nuova task</button></div>`;
    return out + `<div class="agenda">${days.map(d => {
      const dt = new Date(d + 'T12:00:00');
      return `<div class="aday ${d === td ? 'today' : ''}"><div class="adate"><span>${GIORNI[(dt.getDay() + 6) % 7]}</span><b class="num">${dt.getDate()}</b><span>${MESI[dt.getMonth()]}</span></div><div class="aitems">${byDate.get(d).map(evHtml).join('')}</div></div>`;
    }).join('')}</div>`;
  }

  const start = new Date(C.y, C.m, 1 - ((first.getDay() + 6) % 7));
  const cells = [];
  const d = new Date(start);
  do { for(let k = 0; k < 7; k++){ cells.push(new Date(d)); d.setDate(d.getDate() + 1); } } while(d <= last);
  const nRows = cells.length / 7;
  out += `<div class="calwrap"><div class="cal">${GIORNI.map(g => `<div class="wd">${g}</div>`).join('')}${cells.map((c, idx) => {
    const ds = ymd(c), its = byDate.get(ds) || [];
    const cls = ['day', c.getMonth() !== C.m ? 'out' : '', ds === td ? 'today' : '', (idx % 7) >= 5 ? 'we' : '', idx >= (nRows - 1) * 7 ? 'last' : ''].join(' ');
    return `<div class="${cls}" data-date="${ds}"><div class="dh"><span class="dn num">${c.getDate()}</span><button class="dayadd" data-a="cal-day" data-d="${ds}" aria-label="Aggiungi una task il ${c.getDate()} ${MESI_L[c.getMonth()]}">+</button></div>${its.map(evHtml).join('')}</div>`;
  }).join('')}</div></div>`;
  return out;
}

/* ---------- trascinamento nel calendario ---------- */
let drag = null, suppressClick = false;
async function moveItem(kind, id, from, to){
  const col = kind === 'del' ? 'projects' : 'tasks';
  const x = S[col].find(y => y.id === id); if(!x || from === to) return;
  x.due = to; render();
  const ok = await write(db => db.doc(col + '/' + id).update({due:to}));
  if(!ok){ x.due = from; render(); return; }
  toast(`${kind === 'del' ? 'Consegna spostata' : 'Task spostata'} al ${fmtDate(to)}`, 'Annulla', () => moveItem(kind, id, to, from));
}
function startDrag(x, y){
  if(!drag) return;
  const r = drag.el.getBoundingClientRect();
  drag.started = true; drag.dx = x - r.left; drag.dy = y - r.top;
  S.dragging = true;
  const g = drag.el.cloneNode(true);
  g.classList.add('ghost'); g.removeAttribute('data-a'); g.removeAttribute('href');
  g.style.width = r.width + 'px';
  document.body.appendChild(g); drag.ghost = g;
  drag.el.classList.add('dragging');
  document.body.classList.add('is-dragging');
  moveDrag(x, y);
}
function moveDrag(x, y){
  drag.ghost.style.left = (x - drag.dx) + 'px';
  drag.ghost.style.top = (y - drag.dy) + 'px';
  const under = document.elementFromPoint(x, y);
  const day = under && under.closest('.day[data-date]');
  if(drag.over && drag.over !== day) drag.over.classList.remove('drop');
  if(day && day !== drag.over) day.classList.add('drop');
  drag.over = day || null;
  const edge = 70;
  if(y < edge) window.scrollBy(0, -14); else if(y > window.innerHeight - edge) window.scrollBy(0, 14);
  const wrap = document.querySelector('.calwrap');
  if(wrap){ const wr = wrap.getBoundingClientRect(); if(x < wr.left + 40) wrap.scrollLeft -= 14; else if(x > wr.right - 40) wrap.scrollLeft += 14; }
}
function endDrag(commit){
  if(!drag) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  if(!d.started) return;
  const target = d.over ? d.over.dataset.date : null;
  if(d.over) d.over.classList.remove('drop');
  if(d.ghost) d.ghost.remove();
  d.el.classList.remove('dragging');
  document.body.classList.remove('is-dragging');
  S.dragging = false;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
  if(commit && target && target !== d.from) moveItem(d.kind, d.id, d.from, target);
  else if(S.pendingRender){ S.pendingRender = false; render(); }
  S.pendingRender = false;
}
document.addEventListener('pointerdown', e => {
  const ev = e.target.closest('.cal .ev[data-drag]');
  if(!ev || (e.pointerType === 'mouse' && e.button !== 0) || S.readOnly || !S.db) return;
  drag = {kind:ev.dataset.kind, id:ev.dataset.drag, from:ev.dataset.date, el:ev, sx:e.clientX, sy:e.clientY, started:false, touch:e.pointerType !== 'mouse', pid:e.pointerId, over:null};
  if(drag.touch) drag.timer = setTimeout(() => { if(drag && !drag.started) startDrag(drag.sx, drag.sy); }, 380);
});
document.addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  if(!drag.started){
    const dist = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if(drag.touch){ if(dist > 10){ clearTimeout(drag.timer); drag = null; } return; }
    if(dist < 5) return;
    startDrag(e.clientX, e.clientY);
  }
  e.preventDefault();
  moveDrag(e.clientX, e.clientY);
}, {passive:false});
document.addEventListener('touchmove', e => { if(drag && drag.started) e.preventDefault(); }, {passive:false});
document.addEventListener('pointerup', e => { if(drag && e.pointerId === drag.pid) endDrag(true); });
document.addEventListener('pointercancel', e => { if(drag && e.pointerId === drag.pid) endDrag(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && drag) endDrag(false); });
document.addEventListener('dragstart', e => { if(e.target.closest && e.target.closest('.cal .ev')) e.preventDefault(); });
document.addEventListener('contextmenu', e => { if(drag && drag.touch) e.preventDefault(); });
document.addEventListener('click', e => { if(suppressClick){ e.preventDefault(); e.stopPropagation(); suppressClick = false; } }, true);

const eurF = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR', useGrouping:'always'});
S.hideMoney = (() => { try{ return localStorage.getItem('lana-hide-money') === '1'; }catch(e){ return false; } })();
const money = n => S.hideMoney ? '•••• €' : eurF.format(Math.round((+n || 0) * 100) / 100);
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const eyeBtn = () => `<button class="btn eye" data-a="toggle-money" aria-pressed="${S.hideMoney}" title="${S.hideMoney ? 'Mostra gli importi' : 'Nascondi gli importi, per mostrare il gestionale senza far vedere i numeri'}">${S.hideMoney ? EYE_OFF + ' Importi nascosti' : EYE + ' Nascondi importi'}</button>`;
const fmtNum = n => (+n || 0).toLocaleString('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always'});
const compact = n => S.hideMoney ? '' : n >= 1000 ? '€' + (n / 1000).toLocaleString('it-IT', {maximumFractionDigits:1}) + 'k' : '€' + Math.round(n);
function parseEuro(v){
  let s = String(v ?? '').replace(/[€\s]/g, '');
  if(!s) return 0;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
const numv = v => +v || 0;
const invDate = f => f.dateInvoice || f.datePaid || '';
const isPaid = f => !!f.paid || !!f.datePaid;
const byOrder = (a,b) => (a.order || a.createdAt || 0) - (b.order || b.createdAt || 0);
function projFin(pid){
  const inv = S.fatture.filter(f => f.projectId === pid), cost = S.costi.filter(c => c.projectId === pid);
  const lordo = inv.reduce((s,f) => s + numv(f.amount), 0);
  const costi = cost.reduce((s,c) => s + numv(c.amount), 0);
  const incassato = inv.filter(isPaid).reduce((s,f) => s + numv(f.amount), 0);
  return {inv, cost, lordo, costi, margine: lordo - costi, incassato, daIncassare: lordo - incassato};
}
function sumFin(ps){
  const t = {lordo:0, costi:0, margine:0, incassato:0, daIncassare:0};
  ps.forEach(p => { const f = projFin(p.id); for(const k in t) t[k] += f[k]; });
  return t;
}
const yearInv = (y, invs) => (invs || S.fatture).filter(f => invDate(f).startsWith(String(y)));
const yearSum = (y, invs) => yearInv(y, invs).reduce((s,f) => s + numv(f.amount), 0);
const pct = (m, l) => l ? (S.hideMoney ? '••%' : Math.round(m / l * 100) + '%') : '—';
function finYears(){
  const ys = new Set([new Date().getFullYear()]);
  S.fatture.forEach(f => { const y = parseInt(invDate(f).slice(0,4)); if(y) ys.add(y); });
  return [...ys].sort((a,b) => b - a);
}
const finProjHash = p => 'fatture-progetto-' + p.id;
const finClientHash = c => 'fatture-cliente-' + (c ? c.id : 'none');

function viewFin(){

  let out = `<div class="head"><div><h1>Fatture</h1><p class="sub">Fatturato per anno e per mese, poi diviso per cliente e per progetto, con lordo e costi.</p></div>

  <div class="tiles num">

    <div class="tile"><div class="l">${isCur ? 'Questo mese' : 'Media mensile'}</div><div class="v">${money(isCur ? monthNow : (filled ? tot / 12 : 0))}</div><div class="n">${isCur ? MESI_L[now.getMonth()] + ' ' + y : 'su 12 mesi'}</div></div>
    <div class="tile"><div class="l">Incassato ${y}</div><div class="v">${money(inc)}</div><div class="n">delle fatture ${y}</div></div>
    <div class="tile"><div class="l">Da incassare</div><div class="v">${money(daInc)}</div><div class="n">${unpaid.length ? plural(unpaid.length, 'fattura aperta', 'fatture aperte') + ', tutti gli anni' : 'tutto incassato'}</div></div>
  </div>
  ${undated.length ? `<p class="note">${plural(undated.length, 'fattura', 'fatture')} senza data per ${money(undatedSum)}: non ${undated.length === 1 ? 'entra' : 'entrano'} nei totali per anno e per mese. Aggiungi la data fattura dentro il progetto.</p>` : ''}

  const rows = S.clients.map(c => {

  rows.sort((a,b) => b.year - a.year || b.t.lordo - a.t.lordo || (a.c ? a.c.name : 'zzz').localeCompare(b.c ? b.c.name : 'zzz'));
  if(!rows.length) return out + `<div class="empty"><strong>Ancora nessun cliente</strong><p>Crea un cliente e un progetto: dentro il progetto segni il lordo e i costi.</p><button class="btn primary" data-a="new-client">+ Nuovo cliente</button></div>`;

  return out + `<div class="plist">${rows.map(({c, ps, year, t}) => `<a class="prow ${c ? '' : 'dashed'}" href="#${finClientHash(c)}">

}

function gridCell(col, row, c, n){
  const ghost = !row;
  if(c.t === 'check'){
    return ghost ? '<td class="ck"></td>' : `<td class="ck"><input type="checkbox" class="cellck" data-col="${col}" data-row="${esc(row.id)}" data-keep="no" ${isPaid(row) ? 'checked' : ''} aria-label="Incassata, riga ${n}"></td>`;
  }
  const raw = ghost ? '' : row[c.k];
  const masked = S.hideMoney && c.t === 'money' && !ghost;
  const value = masked ? '••••' : c.t === 'money' ? (numv(raw) ? fmtNum(raw) : '') : (raw || '');
  const idPart = ghost ? `id="gn-${col}-${esc(gridCell.pid)}-${c.k}" data-newrow="${esc(gridCell.pid)}"` :`id="g-${col}-${esc(row.id)}-${c.k}" data-row="${esc(row.id)}" data-keep="focus"`;
  return `<td><input class="cell ${c.t === 'money' ? 'money' : ''}" ${masked ? 'readonly' : ''} type="${c.t === 'date' ? 'date' : 'text'}" ${c.t === 'money' ? 'inputmode="decimal"' : ''} ${c.list ? `list="${c.list}"` : ''} ${idPart} data-col="${col}" data-k="${c.k}" data-t="${c.t}" value="${esc(value)}" ${ghost && c.ph ? `placeholder="${esc(c.ph)}"` : ''} aria-label="${esc(c.l)}${ghost ? ', nuova riga' : ', riga ' + n}" autocomplete="off"></td>`;
}
function grid(col, pid, cols, rows, footer){

}

function splitCalc(f){
  const total = Math.abs(parseEuro(f.elements['total'].value));
  let p = parseEuro(f.elements['pct'].value); if(!(p > 0 && p < 100)) p = 50;
  const acc = Math.round(total * p) / 100;
  return {total, p, acc, saldo: Math.round((total - acc) * 100) / 100};
}
function updateSplit(f){
  const s = splitCalc(f), pl = String(s.p).replace('.', ',');
  document.getElementById('sf-preview').innerHTML = `<div><span>Acconto ${pl}%</span><b>${money(s.acc)}</b></div><div><span>Saldo ${String(Math.round((100 - s.p) * 100) / 100).replace('.', ',')}%</span><b>${money(s.saldo)}</b></div>`;
}

/* modifica delle celle */
async function saveCell(el){
  if(el.readOnly) return;
  const col = el.dataset.col, k = el.dataset.k, t = el.dataset.t;
  let v = el.value.trim();
  if(t === 'money') v = Math.abs(parseEuro(v));
  if(el.dataset.newrow !== undefined){
    if(t === 'money' ? !v : !v) return;
    const pid = el.dataset.newrow, id = uid(col === 'costi' ? 'x' : 'f');
    const base = col === 'costi'
      ? {causale:'', categoria:'', beneficiario:'', amount:0, datePaid:'', dateInvoice:''}
      : {desc:'', number:'', amount:0, dateInvoice:'', datePaid:'', paid:false};
    Object.assign(base, {projectId:pid, [k]:v, createdAt:Date.now(), order:Date.now()});
    if(col === 'fatture' && k === 'datePaid') base.paid = true;
    el.value = '';
    S.ghostJump = {col, pid, id, until:Date.now() + 4000, stay: !!el.dataset.stay};
    delete el.dataset.stay;
    await write(db => db.doc(col + '/' + id).set(base));
    return;
  }
  const row = S[col].find(r => r.id === el.dataset.row); if(!row) return;
  const cur = t === 'money' ? numv(row[k]) : String(row[k] || '');
  if(cur === v){ if(t === 'money') el.value = v ? fmtNum(v) : ''; return; }
  const upd = {[k]: v};
  if(col === 'fatture' && k === 'datePaid' && v) upd.paid = true;
  await write(db => db.doc(col + '/' + row.id).update(upd));
}
document.addEventListener('change', e => {
  const el = e.target;
  if(el.matches && el.matches('input.cell')) saveCell(el);
  if(el.matches && el.matches('input.cellck')){
    const row = S.fatture.find(r => r.id === el.dataset.row); if(!row) return;
    write(db => db.doc('fatture/' + row.id).update(el.checked ? {paid:true} : {paid:false, datePaid:''}), el.checked ? 'Segnata come incassata' : 'Segnata da incassare');
  }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if(!el.matches || !el.matches('input.cell')) return;
  const isDate = el.type === 'date';
  if(e.key === 'Enter' || (!isDate && (e.key === 'ArrowDown' || e.key === 'ArrowUp'))){
    e.preventDefault();
    const tr = el.closest('tr'), k = el.dataset.k;
    if(el.dataset.newrow !== undefined && e.key === 'Enter'){
      el.dataset.stay = '1';
      saveCell(el);
      return;
    }
    const sib = e.key === 'ArrowUp' ? tr.previousElementSibling : tr.nextElementSibling;
    const next = sib && sib.querySelector(`input.cell[data-k="${k}"]`);
    if(next){ next.focus(); if(next.type !== 'date') try{ next.select(); }catch(err){} }
    else el.blur();
  }
  if(e.key === 'Escape'){
    const row = el.dataset.row && S[el.dataset.col].find(r => r.id === el.dataset.row);
    if(row){ const v = row[el.dataset.k]; el.value = el.dataset.t === 'money' ? (numv(v) ? fmtNum(v) : '') : (v || ''); }
    else el.value = '';
    el.blur();
  }
});

/* ---------- Collaboratori ---------- */
function linkInfo(l){
  l = (l || '').trim(); if(!l) return null;
  if(l.startsWith('@')) return {href:'https://www.instagram.com/' + encodeURIComponent(l.slice(1)) + '/', label:l};
  const href = /^https?:\/\//i.test(l) ? l : 'https://' + l;
  let label = l;
  try{ const u = new URL(href); label = u.hostname.replace(/^www\./,'') + (u.pathname.length > 1 ? '/…' : ''); }catch(e){}
  return {href, label};
}
const BASE_ROLES = ['Scenografia', 'Hair Stylist', 'Fonico', 'Web Design'];
function allRoles(){
  const m = new Map(BASE_ROLES.map(r => [r, 0]));
  S.collaborators.forEach(c => (c.roles||[]).forEach(r => m.set(r, (m.get(r)||0) + 1)));
  return [...m.entries()].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const allCities = () => [...new Set(S.collaborators.flatMap(c => c.cities || []))].sort((a,b) => a.localeCompare(b));

function viewCollabs(){
  const roles = allRoles(), cities = allCities();

    (!role || (c.roles||[]).includes(role)) &&
    (!city || (c.cities||[]).includes(city)) &&
    (!q || norm([c.name, (c.roles||[]).join(' '), (c.cities||[]).join(' '), c.notes, c.link].join(' ')).includes(q))
  ).sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const any = role || city || q;

  let out = `<div class="head"><div><h1>Collaboratori</h1><p class="sub">${S.collaborators.length} persone e realtà del collettivo. Scegli la figura che ti serve e trovi subito chi chiamare.</p></div>

  out += `<div class="toolbar">
      <input class="search" id="collab-q" type="search" placeholder="Cerca per nome, mansione o città" value="${esc(S.f.q)}" aria-label="Cerca tra i collaboratori" autocomplete="off">

      ${any ? `<button class="btn" data-a="reset-collab">Azzera filtri</button>` : ''}
    </div>
    <div class="chips" role="group" aria-label="Filtra per mansione">
      <button class="chip" aria-pressed="${!role}" data-a="f-role" data-v="">Tutte le figure</button>
      ${roles.map(([r,n]) => `<button class="chip" aria-pressed="${role === r}" data-a="f-role" data-v="${esc(r)}">${esc(r)}<span class="c num">${n}</span></button>`).join('')}
    </div>
    <p class="resline"><b class="num">${list.length}</b> ${list.length === 1 ? 'risultato' : 'risultati'}${role ? ` per <b>${esc(role)}</b>` : ''}${city ? ` a <b>${esc(city)}</b>` : ''}${q ? ` con «${esc(S.f.q.trim())}»` : ''}</p>`;
  if(!list.length) return out + `<div class="empty"><strong>Nessuno corrisponde ai filtri</strong><p>Prova a togliere la città o a cercare un'altra mansione.</p><button class="btn" data-a="reset-collab">Azzera filtri</button></div>`;
  return out + `<div class="cgrid">${list.map(collabCard).join('')}</div>`;
}
function collabCard(c){

/* ---------- eliminazioni ---------- */
const armTimers = new WeakMap();
async function doDelete(spec){
  const i = spec.indexOf(':'); const kind = spec.slice(0, i), id = spec.slice(i + 1);
  if(kind === 'project'){
    const p = projOf(id);
    const back = !p ? 'clienti' : S.route.view.startsWith('fatture') ? finClientHash(clientOfProject(p)) : clientHash(p);
    const ts = S.tasks.filter(t => t.projectId === id);
    const fin = [...S.fatture.filter(x => x.projectId === id).map(x => 'fatture/' + x.id), ...S.costi.filter(x => x.projectId === id).map(x => 'costi/' + x.id)];
    const ok = await write(async db => {
      for(const t of ts) await db.doc('tasks/' + t.id).delete();
      for(const path of fin) await db.doc(path).delete();
      await db.doc('projects/' + id).delete();
    });
    if(ok){ closeSheet(); go(back); toast('Progetto eliminato'); }
  } else if(kind === 'client'){
    const c = clientOf(id); if(!c) return;
    const linked = projectsOf(c);
    const ok = await write(async db => {
      for(const p of linked) await db.doc('projects/' + p.id).update({client:'', clientId:''});
      await db.doc('clients/' + id).delete();
    });
    if(ok){ closeSheet(); go('clienti'); toast('Cliente eliminato. I suoi progetti sono in «Senza cliente».'); }
  } else if(kind === 'collab'){
    const inProj = S.projects.filter(p => Array.isArray(p.crew) && p.crew.includes(id));
    const inTasks = S.tasks.filter(x => x.collabId === id);
    const ok = await write(async db => {
      for(const p of inProj) await db.doc('projects/' + p.id).update({crew: p.crew.filter(x => x !== id)});
      for(const x of inTasks) await db.doc('tasks/' + x.id).update({collabId:''});
      await db.doc('collaborators/' + id).delete();
    });
    if(ok){ closeSheet(); toast('Collaboratore eliminato'); }
  } else if(kind === 'examples'){
    const ok = await write(async db => {
      for(const col of ['tasks','projects','clients']) for(const x of S[col].filter(y => y.esempio)) await db.doc(col + '/' + x.id).delete();
    });
    if(ok){ go('clienti'); toast('Dati di esempio eliminati'); }
  }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]');
  if(!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  switch(a){
    case 'close-sheet': closeSheet(); break;
    case 'f-owner': S.f.owner = t.dataset.v; render(); break;
    case 'f-scope': S.f.scope = t.dataset.v; render(); break;
    case 'cal-who': S.cal.who = t.dataset.v; render(); break;
    case 'cal-allclients': S.cal.sel = []; render(); break;
    case 'cal-client': { const v = t.dataset.v, s = S.cal.sel; S.cal.sel = s.includes(v) ? s.filter(x => x !== v) : s.concat(v); render(); break; }
    case 'cal-prev': case 'cal-next': {
      const d = new Date(S.cal.y, S.cal.m + (a === 'cal-next' ? 1 : -1), 1);
      S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); render(); break;
    }
    case 'cal-today': { const d = new Date(); S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); render(); break; }
    case 'cal-mode': S.cal.mode = t.dataset.v; try{ localStorage.setItem('lana-cal-mode', S.cal.mode); }catch(err){} render(); break;
    case 'cal-day': {
      const sel = S.cal.sel.filter(k => k !== 'lana' && k !== 'none');
      let projectId = '';
      if(sel.length === 1){ const ps = S.projects.filter(p => p.status !== 'chiuso' && (clientOfProject(p) || {}).id === sel[0]); if(ps.length === 1) projectId = ps[0].id; }
      openSheet(taskForm({title:'', due:t.dataset.d, owner: S.cal.who !== 'tutti' ? S.cal.who : 'Gianpiero', projectId, collabId:''}));
      break;
    }
    case 'new-client': openSheet(clientForm(null)); break;
    case 'edit-client': { const c = clientOf(id); if(c) openSheet(clientForm(c)); break; }
    case 'make-client': {
      const name = t.dataset.name; const kid = uid('k');
      const linked = S.projects.filter(p => !clientOfProject(p) && norm(p.client) === norm(name));
      await write(async db => {
        await db.doc('clients/' + kid).set({name, referente:'', email:'', phone:'', notes:'', createdAt:Date.now()});
        for(const p of linked) await db.doc('projects/' + p.id).update({clientId:kid});
      }, 'Scheda cliente creata');
      break;
    }
    case 'new-project': openSheet(projectForm({status:'in-corso', client:t.dataset.client || ''})); break;
    case 'edit-project': { const p = projOf(id); if(p) openSheet(projectForm(p)); break; }
    case 'edit-task': { const x = S.tasks.find(y => y.id === id); if(x) openSheet(taskForm(x)); break; }
    case 'toggle-task': {
      const x = S.tasks.find(y => y.id === id); if(!x) break;
      await write(db => db.doc('tasks/' + id).update({done: !x.done, doneAt: !x.done ? Date.now() : null}));
      break;
    }
    case 'del-task': {
      const x = S.tasks.find(y => y.id === id); if(!x) break;
      const copy = Object.assign({}, x); delete copy.id;
      const ok = await write(db => db.doc('tasks/' + id).delete());
      if(ok) toast('Task eliminata', 'Annulla', () => write(db => db.doc('tasks/' + id).set(copy)));
      break;
    }
    case 'toggle-money': S.hideMoney = !S.hideMoney; try{ localStorage.setItem('lana-hide-money', S.hideMoney ? '1' : '0'); }catch(err){} render(); break;
    case 'inv-new': openSheet(invForm(t.dataset.pid)); break;
    case 'inv-split': { openSheet(splitForm(t.dataset.pid)); const f = document.querySelector('form[data-form="inv-split"]'); if(f) updateSplit(f); break; }
    case 'cost-new': { const el = document.getElementById(`gn-costi-${t.dataset.pid}-causale`); if(el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.focus({preventScroll:true}); } break; }
    case 'row-del': {
      const col = t.dataset.col; const x = S[col].find(y => y.id === id); if(!x) break;
      const copy = Object.assign({}, x); delete copy.id;
      const ok = await write(db => db.doc(col + '/' + id).delete());
      if(ok) toast(col === 'costi' ? 'Spesa eliminata' : 'Fattura eliminata', 'Annulla', () => write(db => db.doc(col + '/' + id).set(copy)));
      break;
    }
    case 'crew-rm': {
      const p = projOf(t.dataset.p); if(!p) break;
      await write(db => db.doc('projects/' + p.id).update({crew: (p.crew||[]).filter(x => x !== id)}));
      break;
    }
    case 'f-role': S.f.role = (S.f.role === t.dataset.v ? '' : t.dataset.v); render(); break;
    case 'reset-collab': S.f.role = ''; S.f.city = ''; S.f.q = ''; { const s = document.getElementById('collab-q'); if(s) s.value = ''; } render(); break;
    case 'new-collab': openSheet(collabForm(null)); break;
    case 'edit-collab': { const c = S.collaborators.find(x => x.id === id); if(c) openSheet(collabForm(c)); break; }
    case 'copy': {
      const v = t.dataset.v;
      try{ await navigator.clipboard.writeText(v); toast('Copiato: ' + v); }
      catch(err){
        const sp = t.previousElementSibling;
        if(sp){ const r = document.createRange(); r.selectNodeContents(sp); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
        toast('Testo selezionato: copialo con Ctrl+C o Cmd+C');
      }
      break;
    }
    case 'arm-del': {
      if(t.dataset.armed){ clearTimeout(armTimers.get(t)); t.disabled = true; await doDelete(t.dataset.del); t.disabled = false; break; }
      t.dataset.orig = t.textContent; t.dataset.armed = '1';
      const k = t.dataset.del;
      t.textContent = k === 'examples:all' ? 'Conferma: elimina gli esempi' : k.startsWith('project') ? 'Conferma: elimina progetto, task e conti' : k.startsWith('client') ? 'Conferma: i progetti restano' : 'Clicca di nuovo per eliminare';
      armTimers.set(t, setTimeout(() => { delete t.dataset.armed; t.textContent = t.dataset.orig; }, 4000));
      break;
    }
  }
});

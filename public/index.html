/* ---------- invio moduli ---------- */
const split = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
async function addTask(f, projectId, focusId, okMsg){
  const el$ = f.elements;
  const title = el$['title'].value.trim(); if(!title){ el$['title'].focus(); return; }
  const data = {projectId, title, owner:el$['owner'].value, due:el$['due'].value || '', collabId: el$['collab'] ? el$['collab'].value : '', done:false, doneAt:null, createdAt:Date.now()};
  const tid = uid('t');
  el$['title'].value = ''; el$['due'].value = ''; if(el$['collab']) el$['collab'].value = '';
  const ok = await write(db => db.doc('tasks/' + tid).set(data), okMsg);
  const el = document.getElementById(focusId);
  if(el){ if(!ok) el.value = title; el.focus(); }
}

document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form, id = f.dataset.id;
  if(kind === 'add-task') return addTask(f, id, 'nt-title-' + id);
  if(kind === 'add-todo') return addTask(f, '', 'todo-title', 'Aggiunta al To do di Lana');
  if(kind === 'crew-add'){
    const cid = f.elements['cid'].value; if(!cid) return;
    const p = projOf(id); if(!p) return;
    const crew = Array.isArray(p.crew) ? p.crew.slice() : [];
    if(!crew.includes(cid)) crew.push(cid);
    await write(db => db.doc('projects/' + id).update({crew}));
    return;
  }

  const btn = f.querySelector('[type=submit]');
  if(btn) btn.disabled = true;
  const fd = new FormData(f);

  if(kind === 'inv'){
    const datePaid = fd.get('datePaid') || '';
    const data = {projectId:id, desc:(fd.get('desc')||'').trim(), number:(fd.get('number')||'').trim(), amount:Math.abs(parseEuro(fd.get('amount'))), dateInvoice:fd.get('dateInvoice') || '', datePaid, paid: fd.get('paid') === 'on' || !!datePaid, createdAt:Date.now(), order:Date.now()};
    if(!data.amount){ toast('Scrivi l’importo della fattura.'); }
    else if(await write(db => db.doc('fatture/' + uid('f')).set(data), 'Fattura aggiunta')) closeSheet();
  } else if(kind === 'inv-split'){
    const s = splitCalc(f);
    if(!s.total){ toast('Scrivi il totale del lavoro.'); }
    else {
      const pl = String(s.p).replace('.', ','), pr = String(Math.round((100 - s.p) * 100) / 100).replace('.', ',');
      const now = Date.now();
      const a = {projectId:id, desc:`Acconto ${pl}%`, number:'', amount:s.acc, dateInvoice:fd.get('d1') || '', datePaid:'', paid:false, createdAt:now, order:now};
      const b = {projectId:id, desc:`Saldo ${pr}%`, number:'', amount:s.saldo, dateInvoice:fd.get('d2') || '', datePaid:'', paid:false, createdAt:now + 1, order:now + 1};
      if(await write(async db => { await db.doc('fatture/' + uid('f')).set(a); await db.doc('fatture/' + uid('f')).set(b); }, 'Acconto e saldo aggiunti')) closeSheet();
    }
  } else if(kind === 'client'){
    const data = {name:(fd.get('name')||'').trim(), referente:(fd.get('referente')||'').trim(), email:(fd.get('email')||'').trim(), phone:(fd.get('phone')||'').trim(), notes:(fd.get('notes')||'').trim()};
    const dup = S.clients.find(c => c.id !== id && norm(c.name) === norm(data.name));
    if(dup) toast('Esiste già un cliente con questo nome.');
    else if(id){
      const old = clientOf(id);
      const linked = old ? projectsOf(old) : [];
      if(await write(async db => {
        await db.doc('clients/' + id).update(data);
        if(old && old.name !== data.name) for(const p of linked) await db.doc('projects/' + p.id).update({client:data.name, clientId:id});
      }, 'Cliente aggiornato')) closeSheet();
    } else {
      const kid = uid('k');
      if(await write(db => db.doc('clients/' + kid).set(Object.assign(data, {createdAt:Date.now()})), 'Cliente creato')){ closeSheet(); go('cliente-' + kid); }
    }
  } else if(kind === 'project'){
    const data = {name:(fd.get('name')||'').trim(), client:(fd.get('client')||'').trim(), status:fd.get('status'), due:fd.get('due') || '', notes:(fd.get('notes')||'').trim()};
    if(id){
      if(await write(async db => { data.clientId = await ensureClient(db, data.client); await db.doc('projects/' + id).update(data); }, 'Progetto aggiornato')) closeSheet();
    } else {
      const pid = uid('p');
      if(await write(async db => { data.clientId = await ensureClient(db, data.client); await db.doc('projects/' + pid).set(Object.assign(data, {crew:[], createdAt:Date.now()})); }, 'Progetto creato')){ closeSheet(); go((S.route.view.startsWith('fatture') ? 'fatture-progetto-' : 'progetto-') + pid); }
    }
  } else if(kind === 'task'){
    const data = {title:(fd.get('title')||'').trim(), owner:fd.get('owner'), due:fd.get('due') || '', projectId:fd.get('projectId') || '', collabId:fd.get('collabId') || ''};
    if(id){
      const old = S.tasks.find(x => x.id === id);
      const done = fd.get('done') === 'on';
      if(old && !!old.done !== done){ data.done = done; data.doneAt = done ? Date.now() : null; }
      if(await write(db => db.doc('tasks/' + id).update(data), 'Task aggiornata')) closeSheet();
    } else {
      const tid = uid('t');
      if(await write(db => db.doc('tasks/' + tid).set(Object.assign(data, {done:false, doneAt:null, createdAt:Date.now()})), 'Task aggiunta')) closeSheet();
    }
  } else if(kind === 'collab'){
    const roles = [...new Set([...fd.getAll('role'), ...split(fd.get('extra'))])];
    const data = {name:(fd.get('name')||'').trim(), roles, cities:split(fd.get('cities')), link:(fd.get('link')||'').trim(), phone:(fd.get('phone')||'').trim(), email:(fd.get('email')||'').trim(), notes:(fd.get('notes')||'').trim()};
    if(id){
      if(await write(db => db.doc('collaborators/' + id).update(data), 'Collaboratore aggiornato')) closeSheet();
    } else {
      const cid = uid('c');
      if(await write(db => db.doc('collaborators/' + cid).set(Object.assign(data, {createdAt:Date.now()})), 'Collaboratore aggiunto')) closeSheet();
    }
  }
  if(btn && document.contains(btn)) btn.disabled = false;
});

/* ---------- avvio ---------- */
async function boot(){
  S.route = readRoute();
  render();
  const c = window.claude;
  if(!c || typeof c.use !== 'function'){ S.dbState = 'off'; render(); return; }
  let db = null;
  try{ db = await c.use('db'); }catch(e){ db = null; }
  if(!db){ S.dbState = 'off'; render(); return; }
  S.db = db; S.dbState = 'on';
  COLS.forEach(col => {
    db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      S.loaded[col] = true;
      render();
    }, err => {
      if(err && err.code === 'revoked') S.readOnly = true;
      S.dbState = 'error'; S.loaded[col] = true; render();
    });
  });
  render();
}
boot();
})();
</script>
